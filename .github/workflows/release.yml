name: Release

on:
  push:
    branches: [main]
  # A manual re-run from the current main, for a release whose publish or GitHub releases failed.
  workflow_dispatch:

# Every merge to main that carries changesets is released by that merge: the job versions the packages, commits
# the bump to main, publishes, and creates the GitHub releases. There is no "Version Packages" pull request to
# merge in between.
#
# OIDC trusted publishing is preferred over a long-lived NPM_TOKEN
# (release-pipeline spec, "Release Workflow Uses OIDC Trusted Publishing").
# `id-token: write` lets `npm publish` mint a short-lived provenance-signed
# token from GitHub's OIDC issuer instead of reading a stored secret;
# `contents: write` lets the job push the version commit and the tags, and
# create the GitHub releases (a permission left out of this block is none).
permissions:
  id-token: write
  contents: write

# One release at a time: a merge that lands during a release waits for it (GitHub keeps one pending run per group,
# the newest), and that run then starts from the current main, so it releases everything still pending.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The current main, not the commit that triggered the run: a run that waited in the concurrency group must
          # see the version commit the run before it pushed, or it would version consumed changesets again.
          ref: main
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Consumes the pending changesets: bumps package.json and CHANGELOG.md, then copies the versions into
      # servers.json and the READMEs' pinned install snippets. The commit is pushed with the workflow's own token,
      # which does not start another workflow run ([skip ci] says so to anyone reading the history too).
      # If main moved since the checkout, the push is refused and this run stops without publishing: the merge that
      # moved main has its own run queued, which starts from the new main and releases everything pending. Publishing
      # here would ship that merge's code under this version without its changelog entry.
      # Prerelease mode (.changeset/pre.json) is not supported: it keeps consumed changesets on disk.
      - name: Version packages
        id: version
        shell: bash
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "No changesets: nothing to version."
            exit 0
          fi
          pnpm version-packages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages [skip ci]"
          if ! git push origin HEAD:main; then
            # Only a main that really moved is left to the queued run; any other refusal (auth, network, a branch
            # protection) fails the job, since no other run would release this.
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~1)" ]; then
              echo "The version commit could not be pushed, and main has not moved." >&2
              exit 1
            fi
            echo "main moved during this run: the queued run releases it instead."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      # After the version step: the bundles embed their package.json version at build time.
      - name: Build
        if: steps.version.outputs.superseded != 'true'
        run: pnpm build

      # Publishes every package whose version is not on npm yet, so a run whose publish failed after its version
      # commit is completed by the next run, changesets or not.
      #
      # OIDC trusted publishing requires npm CLI >= 11.5 and the target
      # package's npm Trusted Publisher configured for this repository +
      # workflow. If OIDC trust is not (yet) configured for the
      # @hiberus-magento scope, fall back to a short-lived scoped
      # NPM_TOKEN in this job only — documented here as a temporary
      # deviation (design.md, Open Questions), never a long-lived token
      # committed to the repository.
      - name: Publish
        if: steps.version.outputs.superseded != 'true'
        # An explicit bash runs with pipefail, so a failed publish is not hidden by tee.
        shell: bash
        run: pnpm changeset publish 2>&1 | tee "$RUNNER_TEMP/publish.log"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One GitHub release per tag the publish created, its notes the version's CHANGELOG section (what the
      # changesets action used to create). It also runs after a publish that failed part-way: `changeset publish`
      # tags the packages it did publish before failing, and those tags would otherwise be lost. It knows only the tags
      # this run's publish created: a re-run (workflow_dispatch) completes a failed publish, but a GitHub release that
      # failed to be created after its package was published has to be created by hand (gh release create <tag>).
      - name: Tags and GitHub releases
        if: ${{ !cancelled() && steps.version.outputs.superseded != 'true' }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/publish.log" ] || exit 0
          node scripts/github-releases.mjs "$RUNNER_TEMP/publish.log" "$RUNNER_TEMP/release-notes" > "$RUNNER_TEMP/releases.tsv"
          while IFS="$(printf '\t')" read -r tag notes; do
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
            gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes-file "$notes"
          done < "$RUNNER_TEMP/releases.tsv"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
